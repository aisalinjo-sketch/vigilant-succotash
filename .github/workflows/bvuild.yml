name: Build Novaria OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso imagemagick curl

      - name: Build Novaria OS ISO
        run: sudo bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: novaria-os-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 3
